[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "keymuse"
version = "2.0.0"
description = "KeyMuse: Python-first music composition engine, AI Music Autopilot, and agent orchestration"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "KeyMuse Core Team", email = "dev@keymuse.io" }
]
dependencies = [
    "pydantic>=2.10.0",
    "numpy>=2.0.0",
    "mcp>=2.3.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "sqlmodel>=0.0.22",
    "httpx>=0.28.0"
]

[project.optional-dependencies]
test = [
    "pytest>=8.3.0"
]

[project.scripts]
keymuse = "keymuse.cli:main"
keymuse-mcp = "keymuse.mcp.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["keymuse*"]
