<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12151a" />
      <stop offset="100%" stop-color="#0a0c10" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2e0" />
      <stop offset="100%" stop-color="#00a399" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="100" fill="url(#bg)" />
  <rect x="4" y="4" width="504" height="504" rx="96" fill="none" stroke="#252b36" stroke-width="8" />

  <!-- Piano Keyboard Graphic -->
  <g transform="translate(64, 180)">
    <!-- White Keys -->
    <rect x="0" y="0" width="50" height="200" rx="8" fill="#ffffff" stroke="#12151a" stroke-width="4" />
    <rect x="54" y="0" width="50" height="200" rx="8" fill="#ffffff" stroke="#12151a" stroke-width="4" />
    <rect x="108" y="0" width="50" height="200" rx="8" fill="#ffffff" stroke="#12151a" stroke-width="4" />
    <rect x="162" y="0" width="50" height="200" rx="8" fill="#ffffff" stroke="#12151a" stroke-width="4" />
    <rect x="216" y="0" width="50" height="200" rx="8" fill="#ffffff" stroke="#12151a" stroke-width="4" />
    <rect x="270" y="0" width="50" height="200" rx="8" fill="#ffffff" stroke="#12151a" stroke-width="4" />
    <rect x="324" y="0" width="50" height="200" rx="8" fill="#ffffff" stroke="#12151a" stroke-width="4" />

    <!-- Active Key Glow (Cyan) -->
    <rect x="108" y="0" width="50" height="200" rx="8" fill="url(#cyanGrad)" stroke="#00f2e0" stroke-width="4" />

    <!-- Black Keys -->
    <rect x="35" y="0" width="34" height="120" rx="6" fill="#1e2430" stroke="#0a0c10" stroke-width="3" />
    <rect x="89" y="0" width="34" height="120" rx="6" fill="#1e2430" stroke="#0a0c10" stroke-width="3" />
    <rect x="197" y="0" width="34" height="120" rx="6" fill="#1e2430" stroke="#0a0c10" stroke-width="3" />
    <rect x="251" y="0" width="34" height="120" rx="6" fill="url(#amberGrad)" stroke="#f59e0b" stroke-width="3" />
    <rect x="305" y="0" width="34" height="120" rx="6" fill="#1e2430" stroke="#0a0c10" stroke-width="3" />
  </g>

  <!-- Sound Waves at top -->
  <path d="M120,110 Q160,70 200,110 T280,110 T360,110 T400,110" fill="none" stroke="#00d2c4" stroke-width="8" stroke-linecap="round" />
  <path d="M160,135 Q200,105 240,135 T320,135 T360,135" fill="none" stroke="#f59e0b" stroke-width="6" stroke-linecap="round" opacity="0.8" />
</svg>
